}
Object.assign(ACT, {
  'sk-new': () => { if (!S.canWrite) return;
    const last = sortByDate(matchesOf('skull')).slice(-1)[0], act = activePlayers().map(p=>p.id);
    openSheet({type:'sk-setup', draft:{date:todayStr(), memo:'', order: last ? last.players.filter(id=>act.includes(id)) : act.slice(0,4), rounds:10, wager: !!(last && last.wager)}}); },
  'sk-resume': () => { const l = skLive()[0]; if (l) skOpenPlay(l.id); },
  'sk-open': b => skOpenPlay(b.dataset.id),
  'sk-edit': b => { S.sheets.pop(); renderSheets(); skOpenPlay(b.dataset.id); },
  'sk-del': b => arm(b, 'もう一度タップで削除', async ()=>{ S.sheets=[]; document.body.style.overflow=''; renderSheets(); try{ await remove('matches', b.dataset.id); toast('削除しました'); }catch(e){} }),
  'sk-s-toggle': b => { const d = topSheet().draft, id = b.dataset.id; d.order = d.order.includes(id) ? d.order.filter(x=>x!==id) : [...d.order, id]; renderSheets(); },
  'sk-s-rounds': b => { const d = topSheet().draft; d.rounds = Math.max(1, Math.min(10, d.rounds + (+b.dataset.d))); renderSheets(); },
  'sk-s-wager': () => { const d = topSheet().draft; d.wager = !d.wager; renderSheets(); },
  'sk-start': async () => {
    const d = topSheet().draft;
    if (d.order.length < 2) return toast('参加者を2人以上選んでください');
    const m = {id:uid(), game:'skull', date:d.date||todayStr(), memo:d.memo.trim(), players:[...d.order], rounds:d.rounds,
      cards:Array.from({length:d.rounds},(_,i)=>i+1), rec:Object.fromEntries(d.order.map(id=>[id, []])), wager:d.wager, status:'live', createdAt:Date.now(), updatedAt:Date.now()};
    S.sheets = []; renderSheets();
    try { await write('matches', m); } catch(e){ return; }
    S.tab = 'home'; setHash(); render();
    skOpenPlay(m.id);
  },
  'sk-num': b => { const sh = skPlay(), m = sh.draft, r = skEnsure(m, b.dataset.pid, sh.cur), f = b.dataset.f, v = +b.dataset.v;
    r[f] = r[f] === v ? null : v; sh.sumOk = null; skTouch(sh); renderSheets(); },
  'sk-bon': b => { const sh = skPlay(), r = skEnsure(sh.draft, b.dataset.pid, sh.cur), k = b.dataset.k, def = SK_BONUS.find(x=>x.k===k);
    r.x = r.x || []; const c = r.x.filter(x=>x===k).length;
    if (c >= def.max) r.x = r.x.filter(x=>x!==k); else r.x.push(k);
    skTouch(sh); renderSheets(); },
  'sk-wager': b => { const sh = skPlay(), r = skEnsure(sh.draft, b.dataset.pid, sh.cur); r.g = +b.dataset.g; skTouch(sh); renderSheets(); },
  'sk-cards': b => { const sh = skPlay(), m = sh.draft, i = sh.cur;
    m.cards = m.cards || Array.from({length:m.rounds},(_,k)=>k+1);
    const n = Math.max(1, Math.min(20, skCards(m,i) + (+b.dataset.d))); m.cards[i] = n;
    m.players.forEach(pid=>{ const r = skRec(m,pid,i); if (r){ if (r.b > n) r.b = null; if (r.w > n) r.w = null; } });
    skTouch(sh); renderSheets(); },
  'sk-round': b => { const sh = skPlay(); sh.cur = +b.dataset.r; renderSheets(); skScrollTop(); },
  'sk-goround': b => { S.sheets.pop(); const sh = skPlay(); if (sh){ sh.cur = +b.dataset.r; } renderSheets(); skScrollTop(); },
  'sk-table': () => openSheet({type:'sk-table'}),
  'sk-next': async () => { const sh = skPlay(); if (!skCheckRound(sh)) return;
    sh.cur = Math.min(sh.draft.rounds-1, sh.cur+1); sh.sumOk = null; renderSheets(); skScrollTop(); skFlush(sh); },
  'sk-finish': async () => { const sh = skPlay(); if (!skCheckRound(sh)) return;
    for (let i=0;i<sh.draft.rounds;i++) if (!skRoundDone(sh.draft, i)){ sh.cur = i; renderSheets(); skScrollTop(); toast(`ラウンド${i+1}がまだ入力されていません`); return; }
    sh.draft.status = 'done'; sh.draft.finishedAt = Date.now(); sh.dirty = true;
    const id = sh.draft.id; S.sheets = []; document.body.style.overflow = ''; renderSheets();
    await skFlush(sh);
    S.tab = 'home'; setHash(); render();
    coins(); openSheet({type:'skull-detail', id, ro:true});
    const w = skRanked(sh.draft)[0]; toast(`${playerMap()[w.pid]?.name||''}の勝ち！ ${fmt(w.total)}点`); },
  'sk-save-done': async () => { const sh = skPlay(); sh.dirty = true; const id = sh.draft.id; S.sheets = []; document.body.style.overflow=''; renderSheets(); await skFlush(sh); openSheet({type:'skull-detail', id, ro:true}); toast('保存しました'); },
  'sk-discard': b => arm(b, 'もう一度タップで破棄', async ()=>{ const sh = skPlay(); sh.dirty = false; const id = sh.draft.id; S.sheets=[]; document.body.style.overflow=''; renderSheets(); lsDel(SK_BACKUP); try{ await remove('matches', id); toast('破棄しました'); }catch(e){} }),
});
ONINPUT.push(t => {
  const sh = topSheet(); if (!sh || sh.type !== 'sk-setup') return;
  if (t.id === 'skDate') sh.draft.date = t.value;
  if (t.id === 'skMemo') sh.draft.memo = t.value;
  return true;
});

/* ================= viewport gap =================
   iPhone のホーム画面から開いたとき、表示領域が画面より短く測られ、下のタブの下に余白ができることがある。
   その差（画面の高さ − 表示領域の高さ）を測り、下に固定した部品をその分だけ下げる。 */
function fixViewportGap(){
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const gap = standalone && innerHeight > innerWidth ? screen.height - innerHeight : 0;
  document.documentElement.style.setProperty('--vp-gap', (gap > 0 && gap < 120 ? gap : 0) + 'px');
}
fixViewportGap();
window.addEventListener('resize', fixViewportGap);
window.addEventListener('orientationchange', () => setTimeout(fixViewportGap, 300));

/* ================= boot ================= */
ACT['open-match'] = b => {
  const m = data().matches.find(x=>x.id===b.dataset.id); if (!m) return;
  if (m.game === 'skull' && m.status === 'live' && S.canWrite) return skOpenPlay(m.id);
  openSheet({type: m.game + '-detail', id: m.id, ro: true});
};
async function boot(){
  const h = (location.hash||'').slice(1);
  const [g, t] = h.includes('.') ? h.split('.') : [null, h];
  const savedG = lsGet('kubota-game');
  if (GAMES.some(x=>x.id===g)) S.game = g; else if (GAMES.some(x=>x.id===savedG)) S.game = savedG;
  if (TABS.some(x=>x.id===t)) S.tab = t; else if (t === 'games') S.tab = 'history';
  const cv = lsGet('kubota-catan-var'); if (CATAN_TABS.some(([k])=>k===cv)) S.catanVar = cv;
  render();
  if (API){
    S.backend = 'api';
    if (loadCache()){ S.mode = 'shared'; S.loaded = allLoaded(); }
    render();
    await pull(true);
    startPolling();
    return;
  }
  const cl = window.claude;
  let d = null;
  if (cl && typeof cl.use === 'function'){ try { d = await cl.use('db'); } catch(e){ d = null; } }
  if (d){
    cdb = d; S.backend = 'claude'; S.mode = 'shared'; S.loaded = {players:false, sessions:false, matches:false};
    subscribeClaude(); render();
    try { const u = await cl.use('user'); if (u){ const c = await u.can('data.write'); if (c === false){ S.canWrite = false; render(); } } } catch(e){}
  } else { S.backend = 'local'; S.mode = 'local'; loadLocal(); render(); }
}
if (API && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
boot();

})();
</script>
